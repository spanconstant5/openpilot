name: Build Panda TSS3 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-panda:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: starpilot-corolla-2025-tss3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install Python build deps
        run: pip install scons pycryptodome opendbc

      - name: Build panda_h7.bin.signed
        working-directory: panda
        run: scons board/obj/panda_h7.bin.signed -j2

      - name: Verify TSS3 TX entry
        run: |
          python3 - <<'PYEOF'
          import struct, sys, hashlib
          with open("panda/board/obj/panda_h7.bin.signed", "rb") as f:
              data = f.read()
          sha = hashlib.sha256(data).hexdigest()
          print(f"SHA256: {sha}")
          print(f"Size:   {len(data):,} bytes")
          idx = data.find(b"DEV-")
          if idx >= 0:
              print(f"Build:  {data[idx:idx+32].split(b'\x00')[0].decode()}")
          needle = struct.pack("<iIi", 0x160, 0, 32)
          i = 0; found = False
          while True:
              i = data.find(needle, i)
              if i == -1: break
              cr = data[i + 12]
              print(f"0x160 bus=0 len=32 check_relay={cr} at 0x{i:X}")
              if cr == 1: found = True
              i += 1
          if found:
              print("PASS: TSS3 TX entry present")
          else:
              print("FAIL"); sys.exit(1)
          PYEOF

      - name: Commit updated binary
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add panda/board/obj/panda_h7.bin.signed
          if git diff --cached --quiet; then
            echo "Binary unchanged"
          else
            git commit -m "panda: rebuild with TSS3 TX support (0x160 bus=0 len=32)"
            git push
          fi
